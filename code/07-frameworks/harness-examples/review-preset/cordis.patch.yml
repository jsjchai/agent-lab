# DeepSeek Harness 自定义 Agent Preset 示例
# 
# 这个 preset 定义了一个「代码审查专家」Agent：
# - 使用 persona 插件注入系统提示词前缀
# - 只挂载 bash 工具（用于读取文件、运行测试）
# - 不挂载 fs 工具（防止修改代码，只能审查）
#
# 安装方式：
#   在 DSH Web GUI 的 Plugins 页面 → Add plugin → 选择此目录
#   或使用 plugin_manager 工具：
#     plugin_manager({ action: 'install_bundle', target: '/absolute/path/to/review-preset' })

- insert:
    - id: preset-review
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: review
        name: Code Review
        description: 只读代码审查 Agent，可以运行测试但不能修改文件。
        order: 20
        plugins:
          # 人设：定义 Agent 的角色和行为准则
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |
                你是一位资深代码审查专家。你的职责是：
                1. 审查代码变更，指出潜在问题、bug、性能隐患
                2. 提出改进建议，但**绝不直接修改代码**
                3. 可以运行测试命令验证代码行为
                4. 用中文输出审查报告，结构清晰
                
                重要约束：
                - 你只有 bash 工具，没有文件编辑工具
                - 如果需要查看文件，使用 cat/head/tail 等命令
                - 如果需要运行测试，使用项目配置的测试命令
                - 发现问题时，给出具体修复建议，但不要执行修改

          # 工具：只给 bash，不给 fs（read/write/edit）
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
